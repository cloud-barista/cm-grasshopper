# This workflow performs continuous delivery (CD) to CM servers.
# This workflow will build the agent and server binaries. Then deploy to CM servers.
name: Deploy to CM Server

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - "CODEOWNERS"
      - "docs/**"
      - "scripts/**"
jobs:
  build-and-deploy:
    name: Build and deploy
    strategy:
      matrix:
        go-version: ["1.26.2"]
        os: [ubuntu-22.04]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{matrix.go-version}}

      - name: Build
        run: make build-only

      - name: Copy binary to NFS server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CM_SERVER_IP_NFS }}
          username: ${{ secrets.CM_SERVER_SSH_USER }}
          password: ${{ secrets.CM_SERVER_SSH_PASSWORD }}
          port: ${{ secrets.CM_SERVER_SSH_PORT }}
          source: "cmd/cm-grasshopper/cm-grasshopper"
          target: "/tmp/"
          strip_components: 2
          overwrite: true

      - name: Restart service from NFS server with new binary
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CM_SERVER_IP_NFS }}
          username: ${{ secrets.CM_SERVER_SSH_USER }}
          password: ${{ secrets.CM_SERVER_SSH_PASSWORD }}
          port: ${{ secrets.CM_SERVER_SSH_PORT }}
          script: |
            set -e

            # Ensure the RustFS object store (dependency of cm-grasshopper) is running.
            RUSTFS_DATA_DIR=/var/lib/cm-grasshopper/rustfs_data
            mkdir -p "$RUSTFS_DATA_DIR"
            docker pull rustfs/rustfs:latest
            docker rm -f cm-grasshopper-rustfs 2>/dev/null || true
            docker run -d \
              --name cm-grasshopper-rustfs \
              --restart always \
              --user 0:0 \
              -p 19000:9000 \
              -e RUSTFS_ACCESS_KEY=rustfsadmin \
              -e RUSTFS_SECRET_KEY=rustfsadmin \
              -e RUSTFS_VOLUMES=/data \
              -e RUSTFS_ADDRESS=:9000 \
              -v "$RUSTFS_DATA_DIR":/data \
              rustfs/rustfs:latest

            # Wait until RustFS is healthy before (re)starting cm-grasshopper.
            for i in $(seq 1 30); do
              if curl -s -o /dev/null http://127.0.0.1:19000/; then
                break
              fi
              sleep 2
            done

            systemctl stop cm-grasshopper
            mv -f /tmp/cm-grasshopper /usr/bin/cm-grasshopper
            systemctl start cm-grasshopper
